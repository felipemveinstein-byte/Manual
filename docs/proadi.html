<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual PROADI-SUS - 2ª Atualização</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 4px;
        }
        
        .info-box p {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .file-info {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Manual PROADI-SUS</h1>
        <p class="subtitle">2ª Atualização - 06.09.2024</p>
        
        <div class="info-box">
            <p><strong>ℹ️ Informação:</strong> Este é um documento público de acesso gratuito para fins educacionais e de consulta.</p>
        </div>
        
        <div class="spinner" id="spinner"></div>
        
        <p style="color: #666; margin: 20px 0;">Preparando o download...</p>
        
        <a href="javascript:downloadPDF()" class="download-btn">
            ⬇️ Baixar Manual (PDF)
        </a>
        
        <div class="file-info">
            <p>📄 Tamanho: ~7.7 MB</p>
            <p>🕐 Última atualização: 06/09/2024</p>
        </div>
    </div>
    
    <script>
        function downloadPDF() {
            // Tenta usar a API de download do GitHub
            const downloadUrl = 'https://github.com/felipemveinstein-byte/Manual/raw/main/Manual_Proadi_SUS___2da_atualizacao___06.09.2024.pdf';
            
            // Cria um link temporário
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'Manual_Proadi_SUS_2da_atualizacao.pdf';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Fallback: abre em nova aba se download não funcionar
            setTimeout(() => {
                window.open(downloadUrl, '_blank');
            }, 500);
        }
        
        // Inicia download automaticamente após 2 segundos
        setTimeout(() => {
            downloadPDF();
        }, 2000);
    </script>
</body>
</html>
